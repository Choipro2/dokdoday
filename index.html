<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#123d4d">
<meta name="description" content="잊지말아야 할 우리의 땅. 강치 가족과 함께 독도의 지리·역사·생태를 알아보는 탐험.">
<title>Dokdoday · 잊지말아야 할 우리의 땅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23123d4d'/><path d='M8 46 L20 26 L28 18 L36 30 L40 46Z' fill='%236c8d99'/><path d='M34 46 L44 34 L52 32 L58 46Z' fill='%237fa3ae'/><rect x='0' y='44' width='64' height='20' fill='%231e7bb0'/></svg>">
</head>
<body>

<!-- ============ 처음 화면 ============ -->
<section id="title" class="screen active">
  <canvas id="titleCanvas"></canvas>
  <div class="title-wrap">
    <div class="title-date">10.25</div>
    <div class="title-line"></div>
    <div class="title-sub">독도의 날</div>
    <h1 class="logo">Dokdo-day</h1>
    <div class="logo-sub">잊지말아야 할 우리의 땅</div>
  </div>
  <div class="class-goal" id="classGoal" style="display:none"></div>
  <div class="title-mascot" id="titleMascot"><p id="mascotTalk">안녕! 강치 가족과 함께 독도 탐험을 떠나 볼까?</p><img src="mascot.png" alt="학교 마스코트"></div>
  <div class="title-menu">
    <div class="title-buttons">
      <button class="pill big primary" data-act="new">게임 시작</button>
      <button class="pill big" data-act="continue" id="btnContinue">이어 하기</button>
      <button class="pill big mint" data-act="ranking">랭킹 보기</button>
    </div>
    <button class="who-tag" id="whoTag" style="display:none"></button>
    <div class="title-links">
      <button data-act="settings">환경설정</button>
      <button data-act="guide">독도가 궁금해요</button>
      <button data-act="free">자유 탐험</button>
      <button data-act="book">기록책</button>
      <button data-act="chapters" id="lnkChapters">장 고르기 ★</button>
      <button data-act="dress" id="lnkDress">강치 꾸미기</button>
    </div>
  </div>
</section>

<!-- ============ 게임 화면 ============ -->
<section id="game" class="screen">
  <canvas id="gameCanvas"></canvas>

  <div class="hud hud-tl">
    <div class="hud-chapter" id="hudChapter">1장 · 두 섬, 하나의 집</div>
    <div class="hud-place" id="hudPlace">독도, 1901 · 가제바위 주변</div>
    <div class="hud-goals" id="hudGoals"></div>
    <div class="hud-life">
      <div class="hearts" id="hudHearts"></div>
      <div class="boost"><span>돌진</span><i id="hudBoost"></i></div>
    </div>
  </div>

  <div class="hud hud-tr">
    <button class="icon-btn" data-act="dex" title="바다 친구 도감">도감 <b id="hudDex">0 / 20</b></button>
    <button class="icon-btn" data-act="book" title="기록책">기록책</button>
    <button class="icon-btn" data-act="mute" id="btnMute" title="소리">소리 켜짐</button>
    <button class="icon-btn round" data-act="pause" title="일시정지">Ⅱ</button>
  </div>

  <div class="hud hud-depth">
    <div class="depth-label">수심<b id="hudDepth">0m</b></div>
    <div class="depth-bar"><i id="hudDepthBar"></i></div>
    <div class="depth-max" id="hudDepthMax">416m</div>
  </div>

  <div class="mentor" id="mentor"><canvas id="mentorFace" width="88" height="88"></canvas><div><small id="mentorName">엄마 강치</small><p id="mentorText"></p><em id="mentorKey"></em></div></div>
  <div class="toast" id="toast"></div>

  <div class="hud hud-keys" id="hudKeys">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 또는 <kbd>←↑↓→</kbd> 이동</span>
    <span><kbd>Shift</kbd> 돌진</span>
    <span><kbd>E</kbd> 관찰</span>
    <span><kbd>F</kbd> 바위 오르내리기</span>
  </div>

  <!-- 터치 조작 -->
  <div class="touch" id="touch">
    <div class="stick" id="stick"><i id="stickKnob"></i></div>
    <div class="touch-btns">
      <button id="tDash">돌진</button>
      <button id="tObserve">관찰</button>
      <button id="tClimb">오르기</button>
    </div>
  </div>
</section>

<!-- ============ 이야기 ============ -->
<section id="story" class="screen">
  <canvas id="storyCanvas"></canvas>
  <div class="story-top">
    <div><small id="storyYear">1901년 봄</small><h2 id="storyTitle">프롤로그</h2></div>
    <div class="story-tools">
      <button class="ghost" id="storyLog">대화 기록</button>
      <button class="ghost" id="storySkip">이야기 건너뛰기 ›</button>
    </div>
  </div>
  <div class="story-badge">창작 이야기 · 실제 역사는 엽서와 기록으로 확인해요</div>
  <div class="dialog" id="dialog">
    <canvas id="speakerFace" width="160" height="160"></canvas>
    <div class="dialog-body">
      <div class="speaker" id="speaker">강이</div>
      <p id="line"></p>
      <div class="choices" id="choices"></div>
    </div>
    <button class="next" id="storyNext">계속 ›</button>
  </div>
</section>

<!-- ============ 퀴즈 대결 알림 ============ -->
<button id="quizBanner" style="display:none">⚡ 선생님이 퀴즈 대결을 열었어요! <b>참여하기 ›</b></button>

<!-- ============ 가로 화면 안내 ============ -->
<div id="rotate">
  <div class="rot-icon">⟳</div>
  <h2>가로로 돌려 주세요</h2>
  <p>넓은 바다에서 강치와 함께 만나요!</p>
  <button class="pill" id="btnFull">전체화면으로 보기</button>
</div>

<!-- ============ 모달 ============ -->
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script type="module" src="main.js"></script>
</body>
</html>
