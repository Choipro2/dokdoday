<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>독도 퀴즈 대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --deep:#123d4d; --sea:#1e7bb0; --card:#fffaf0; --sun:#ffcf5a; --ink:#17323d; --ok:#3f9b5a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: 'Gowun Dodum', 'Malgun Gothic', sans-serif; color: var(--ink); background: linear-gradient(160deg, #0f4a6e, #123d4d 50%, #0b2a36); }
  h1, h2, h3, .jua, button { font-family: 'Jua', sans-serif; font-weight: 400; }
  button { cursor: pointer; border: 0; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 26px 30px 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; color: #fff; gap: 12px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 30px; }
  .top small { opacity: .8; font-size: 15px; display: block; }
  .btn { padding: 12px 22px; border-radius: 26px; background: var(--sun); color: var(--ink); font-size: 19px; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  .btn.light { background: #fff; }
  .btn.ghost { background: rgba(255,255,255,.15); color: #fff; box-shadow: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .stage { margin-top: 22px; background: var(--card); border-radius: 28px; padding: 30px 34px; min-height: 520px; box-shadow: 0 20px 50px rgba(0,0,0,.35); position: relative; }
  .center { text-align: center; }
  .big { font-size: 64px; color: var(--deep); margin: 10px 0; }
  .join-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 20px; }
  .join-grid div { padding: 12px; border-radius: 14px; background: #eaf6fb; font-size: 18px; text-align: center; animation: pop .3s ease-out; }
  .join-grid b { color: #c0603f; margin-right: 4px; font-family: 'Jua'; font-weight: 400; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  .qhead { display: flex; justify-content: space-between; align-items: center; color: #5d7682; font-size: 18px; }
  .timer { width: 86px; height: 86px; border-radius: 50%; background: var(--deep); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Jua'; font-size: 40px; }
  .timer.low { background: #e2574c; }
  .qtext { font-family: 'Jua'; font-size: 44px; text-align: center; margin: 20px 0 28px; line-height: 1.3; color: var(--deep); word-break: keep-all; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .opt { display: flex; align-items: center; gap: 14px; padding: 20px 22px; border-radius: 20px; color: #fff; font-family: 'Jua'; font-size: 30px; min-height: 100px; position: relative; overflow: hidden; }
  .opt b { display: inline-flex; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.3); align-items: center; justify-content: center; font-weight: 400; flex: none; }
  .opt .cnt { margin-left: auto; font-size: 34px; }
  .opt .fill { position: absolute; left: 0; bottom: 0; height: 8px; background: rgba(255,255,255,.6); }
  .c0 { background: #e2574c; } .c1 { background: #2f86c9; } .c2 { background: #e8a51f; } .c3 { background: #3f9b5a; }
  .dim { opacity: .3; }
  .right { outline: 6px solid var(--deep); transform: scale(1.02); }
  .progress { margin-top: 22px; text-align: center; font-size: 22px; color: #4b7488; }
  .progress b { color: var(--deep); font-family: 'Jua'; font-weight: 400; font-size: 30px; }
  .board { list-style: none; padding: 0; margin: 18px auto 0; max-width: 680px; }
  .board li { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 16px; background: #eaf6fb; margin-top: 8px; font-size: 22px; }
  .board li:nth-child(1) { background: #fff1c2; } .board li:nth-child(2) { background: #eef1f4; } .board li:nth-child(3) { background: #f6e3d3; }
  .board .r { width: 44px; font-family: 'Jua'; font-size: 26px; color: #c0603f; text-align: center; }
  .board .s { margin-left: auto; font-family: 'Jua'; font-size: 26px; color: var(--deep); }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin-top: 26px; }
  .podium div { width: 210px; border-radius: 20px 20px 0 0; text-align: center; color: #fff; padding: 16px 10px; font-family: 'Jua'; }
  .podium .p1 { min-height: 290px; background: #e8a51f; } .podium .p2 { min-height: 240px; background: #8aa0ad; } .podium .p3 { min-height: 210px; background: #c07a4f; }
  .podium .medal { font-size: 50px; } .podium .name { font-size: 24px; margin-top: 6px; } .podium .sc { font-size: 20px; opacity: .9; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
  .note { color: #5d7682; font-size: 15px; text-align: center; margin-top: 12px; }
  #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(#123d4d, #0b2a36); z-index: 10; }
  #gate form { background: var(--card); padding: 28px 30px; border-radius: 24px; text-align: center; width: min(360px, 90vw); }
  #gate input { width: 100%; margin: 14px 0; padding: 12px; border-radius: 12px; border: 2px solid #d9e7ee; font: inherit; font-size: 22px; text-align: center; letter-spacing: 6px; }
  #gate p { margin: 0; font-size: 14px; color: #c0603f; min-height: 20px; }
  select { font: inherit; font-size: 18px; padding: 8px 12px; border-radius: 12px; border: 2px solid #d9e7ee; }
</style>
</head>
<body>
<div id="gate">
  <form id="gateForm">
    <h2 style="margin:0;color:#123d4d">퀴즈 대결 진행</h2>
    <div style="color:#4b7488;font-size:14px">선생님 비밀번호를 입력해 주세요</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <p id="gateMsg"></p>
    <button class="btn" type="submit">열기</button>
  </form>
</div>
<div class="wrap">
  <div class="top">
    <div><h1>⚡ 독도 퀴즈 대결</h1><small id="sub">TV 화면에 띄우고 학생들은 윈도우북으로 참여해요</small></div>
    <div style="display:flex;gap:8px"><a class="btn ghost" href="class.html" style="text-decoration:none">현황판</a><button class="btn ghost" id="closeBtn" hidden>대결 닫기</button></div>
  </div>
  <div class="stage" id="stage"><p class="center">불러오는 중…</p></div>
</div>

<script type="module">
import { CLASS_NAME, TEACHER_PIN, CLASS_PATH } from './config.js';
const LINK = { './': CLASS_PATH, 'quiz.html': `${CLASS_PATH}/quiz`, 'class.html': `${CLASS_PATH}/class` };
document.querySelectorAll('a[href]').forEach(a => { const h = a.getAttribute('href'); if (LINK[h]) a.setAttribute('href', LINK[h]); });
import * as Net from './online.js';
import { BATTLE_QUESTIONS } from './data.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.title = `${CLASS_NAME} 독도 퀴즈 대결`;
document.querySelector('.top h1').textContent = `⚡ ${CLASS_NAME} 독도 퀴즈 대결`;
const LIMIT = 20; // 문제당 초
let st = null, answers = [], tick = null, lastKey = '', lastSig = '', autoRevealT = null;

function unlock() { $('#gate').remove(); start(); }
if (!TEACHER_PIN || sessionStorage.getItem('dokdo-teacher') === TEACHER_PIN) unlock();
$('#gateForm')?.addEventListener('submit', (e) => {
  e.preventDefault();
  if ($('#pin').value === TEACHER_PIN) { sessionStorage.setItem('dokdo-teacher', TEACHER_PIN); unlock(); }
  else { $('#gateMsg').textContent = '비밀번호가 달라요'; $('#pin').value = ''; }
});

function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const joined = () => answers.filter(a => a.q_index === -1);
const answersFor = (i) => answers.filter(a => a.q_index === i);

async function refresh() {
  try {
    st = await Net.getQuiz();
    answers = st && st.session ? await Net.getAnswers(st.session) : [];
  } catch (e) { $('#sub').textContent = '연결이 불안정해요. 잠시 뒤 다시 시도해요.'; return; }
  render();
}

async function setState(fields) {
  try { const r = await Net.setQuiz(fields); st = r && r[0] ? r[0] : { ...st, ...fields }; }
  catch (e) { alert('저장하지 못했어요. Supabase 업그레이드 SQL을 실행했는지 확인해 주세요.\n' + e.message); return; }
  lastKey = ''; lastSig = ''; answers = st.session ? await Net.getAnswers(st.session) : []; render();
}

function render() {
  const stage = $('#stage');
  const status = st?.status || 'idle';
  $('#closeBtn').hidden = status === 'idle';
  const key = `${status}:${st?.q_index}`;
  const fresh = key !== lastKey; lastKey = key;
  // 질문 화면 밖에서는 내용이 바뀔 때만 다시 그려요 (깜빡임 방지)
  const sig = `${key}:${answers.length}`;
  if (status !== 'question' && sig === lastSig) return;
  lastSig = sig;

  if (status === 'idle') {
    stage.innerHTML = `<div class="center"><div style="font-size:90px">🦭⚡</div><h2 class="big">독도 퀴즈 대결</h2>
      <p style="font-size:20px">엽서와 이야기에서 배운 내용으로 ${CLASS_NAME} 친구들과 겨뤄요.<br>빨리 맞힐수록 점수가 높아요 (문제당 ${LIMIT}초).</p>
      <p>문제 수 <select id="qn">${[5, 8, 10, 12, 16].map(n => `<option ${n === 10 ? 'selected' : ''}>${n}</option>`).join('')}</select></p>
      <div class="actions"><button class="btn" id="open">대결 열기</button></div>
      <p class="note">대결을 열면 학생 화면 위쪽에 ‘퀴즈 대결 참여하기’ 알림이 떠요.</p></div>`;
    $('#open').onclick = () => {
      const n = +$('#qn').value;
      const qs = shuffle(BATTLE_QUESTIONS.map((_, i) => i)).slice(0, n);
      setState({ session: 's' + Date.now(), status: 'lobby', q_index: -1, qs });
    };
    return;
  }
  const qs = st.qs || [];
  if (status === 'lobby') {
    const j = joined();
    stage.innerHTML = `<div class="center"><h2 class="big" style="font-size:46px">친구들이 들어오고 있어요</h2>
      <p style="font-size:22px">게임 화면 위쪽 노란 알림 <b>‘참여하기’</b>를 눌러요 · 참가 <b class="jua" style="font-size:34px">${j.length}</b>명</p></div>
      <div class="join-grid">${j.map(a => `<div><b>${a.number ?? ''}</b>${esc(a.nickname)}</div>`).join('')}</div>
      <div class="actions"><button class="btn" id="go" ${j.length ? '' : 'disabled'}>시작하기 (${qs.length}문제)</button></div>`;
    $('#go').onclick = () => setState({ status: 'question', q_index: 0 });
    return;
  }
  const q = BATTLE_QUESTIONS[qs[st.q_index]];
  const ans = answersFor(st.q_index);
  const counts = [0, 1, 2, 3].map(k => ans.filter(a => a.choice === k).length);
  if (status === 'question') {
    if (fresh) {
      stage.innerHTML = `<div class="qhead"><span>${st.q_index + 1} / ${qs.length}번 문제</span><div class="timer" id="timer">${LIMIT}</div></div>
        <div class="qtext">${q.q}</div>
        <div class="opts">${q.o.map((o, k) => `<div class="opt c${k}"><b>${'ABCD'[k]}</b>${o}</div>`).join('')}</div>
        <div class="progress">답한 친구 <b id="ansN">0</b> / ${joined().length}명</div>
        <div class="actions"><button class="btn light" id="rev">정답 공개</button></div>`;
      $('#rev').onclick = reveal;
    }
    $('#ansN').textContent = ans.length;
    const started = st.q_started_at ? new Date(st.q_started_at).getTime() : Date.now();
    const left = Math.max(0, Math.ceil(LIMIT - (Date.now() - started) / 1000 - clockSkew / 1000));
    const t = $('#timer'); t.textContent = left; t.classList.toggle('low', left <= 5);
    if ((left <= 0 || (ans.length >= joined().length && joined().length)) && !autoRevealT) autoRevealT = setTimeout(() => { autoRevealT = null; reveal(); }, 1200);
    return;
  }
  if (status === 'reveal') {
    const rows = Net.quizScores(answers, qs, BATTLE_QUESTIONS, st.q_index);
    const total = Math.max(1, ans.length);
    stage.innerHTML = `<div class="qhead"><span>${st.q_index + 1} / ${qs.length}번 문제 · 정답 공개</span><span>정답 ${counts[q.a]}명 / 답한 ${ans.length}명</span></div>
      <div class="qtext" style="font-size:34px">${q.q}</div>
      <div class="opts">${q.o.map((o, k) => `<div class="opt c${k} ${k === q.a ? 'right' : 'dim'}"><b>${k === q.a ? '✓' : 'ABCD'[k]}</b>${o}<span class="cnt">${counts[k]}</span><i class="fill" style="width:${counts[k] / total * 100}%"></i></div>`).join('')}</div>
      <h3 class="center" style="margin:24px 0 0;font-size:26px;color:#123d4d">지금 순위</h3>
      <ol class="board">${rows.slice(0, 5).map((r, i) => `<li><span class="r">${i + 1}</span>${r.number ?? ''}번 ${esc(r.nickname)}<span class="s">${r.score}</span></li>`).join('')}</ol>
      <div class="actions"><button class="btn" id="next">${st.q_index + 1 < qs.length ? '다음 문제' : '최종 순위 보기'}</button></div>`;
    $('#next').onclick = () => st.q_index + 1 < qs.length ? setState({ status: 'question', q_index: st.q_index + 1 }) : setState({ status: 'end' });
    return;
  }
  if (status === 'end') {
    const rows = Net.quizScores(answers, qs, BATTLE_QUESTIONS);
    const p = (i) => rows[i] ? `<div class="medal">${['🥇', '🥈', '🥉'][i]}</div><div class="name">${rows[i].number ?? ''}번 ${esc(rows[i].nickname)}</div><div class="sc">${rows[i].score}점 · ${rows[i].right}개 정답</div>` : '';
    stage.innerHTML = `<h2 class="center big" style="font-size:48px">🏆 최종 순위</h2>
      <div class="podium"><div class="p2">${p(1)}</div><div class="p1">${p(0)}</div><div class="p3">${p(2)}</div></div>
      <ol class="board" start="4">${rows.slice(3, 12).map((r, i) => `<li><span class="r">${i + 4}</span>${r.number ?? ''}번 ${esc(r.nickname)}<span class="s">${r.score}</span></li>`).join('')}</ol>
      <div class="actions"><button class="btn" id="again">새 대결 열기</button><button class="btn light" id="done">대결 마치기</button></div>`;
    $('#again').onclick = () => { const qs2 = shuffle(BATTLE_QUESTIONS.map((_, i) => i)).slice(0, qs.length); setState({ session: 's' + Date.now(), status: 'lobby', q_index: -1, qs: qs2 }); };
    $('#done').onclick = () => setState({ status: 'idle' });
  }
}
function reveal() { if (st?.status === 'question') setState({ status: 'reveal' }); }

// 서버 시계와 이 컴퓨터 시계 차이 (타이머용)
let clockSkew = 0;
async function measureSkew() {
  try {
    const r = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
    const d = r.headers.get('date'); if (d) clockSkew = Date.now() - new Date(d).getTime();
  } catch (e) { /* 무시 */ }
}

function start() {
  if (!Net.online) { $('#stage').innerHTML = '<p class="center">config.js에 Supabase 정보를 넣어야 퀴즈 대결을 열 수 있어요.</p>'; return; }
  measureSkew();
  refresh();
  tick = setInterval(refresh, 1000);
  $('#closeBtn').onclick = () => { if (confirm('퀴즈 대결을 닫을까요?')) setState({ status: 'idle' }); };
}
</script>
</body>
</html>
